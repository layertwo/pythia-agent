name: Container build and release

on:
  workflow_dispatch:
  push:
    branches: [ "mainline" ]
    paths:
      - src/**
      - tests/integration/**
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/workflows/container-build.yml
  pull_request:
    branches: [ "mainline" ]
    paths:
      - src/**
      - tests/integration/**
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/workflows/container-build.yml

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/layertwo/pythia-agent

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0

    - name: Build pythia image to tarball
      uses: docker/build-push-action@v7.2.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        tags: pythia-agent:test
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,scope=${{ matrix.arch }},mode=max
        outputs: type=docker,dest=/tmp/pythia-image.tar

    - name: Upload amd64 image artifact for integration
      if: matrix.arch == 'amd64'
      uses: actions/upload-artifact@v7
      with:
        name: pythia-image-amd64
        path: /tmp/pythia-image.tar
        retention-days: 1

  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Download amd64 image artifact
      uses: actions/download-artifact@v8
      with:
        name: pythia-image-amd64
        path: /tmp

    - name: Load image into docker daemon
      run: docker load -i /tmp/pythia-image.tar

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.11.16"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Install dependencies
      run: uv sync --frozen --all-extras --all-groups

    - name: Start stack
      run: docker compose -f tests/integration/compose.yaml up -d --wait

    - name: Run integration tests
      run: uv run pytest tests/integration/ -m integration --no-cov -v

    - name: Dump container logs on failure
      if: failure()
      run: docker compose -f tests/integration/compose.yaml logs

    - name: Tear down
      if: always()
      run: docker compose -f tests/integration/compose.yaml down -v

  publish:
    needs: integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@v6

    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0

    - name: Log into registry
      uses: docker/login-action@v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@v7.2.0
      with:
        context: .
        push: true
        tags: ghcr.io/layertwo/pythia-agent:latest
        cache-from: type=gha

    - name: Sign the published Docker image
      env:
        TAGS: ghcr.io/layertwo/pythia-agent:latest
        DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

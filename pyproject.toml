[project]
name = "pythia-agent"
version = "0.1.0"
description = "Self-hosted Strands agent with mem0 persistent memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[ollama]",
    "mem0ai",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "requests",
    "feedparser",
    "croniter",
]

[project.optional-dependencies]
all-providers = [
    "strands-agents[anthropic]",
    "strands-agents[openai]",
    "strands-agents[bedrock]",
    "strands-agents[litellm]",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
]
search = [
    "exa-py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pythia_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=pythia_agent --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/pythia_agent"]
omit = ["src/pythia_agent/__main__.py"]

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.ruff]
line-length = 120
target-version = "py311"

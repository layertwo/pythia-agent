[project]
name = "pythia-agent"
version = "0.1.0"
description = "Self-hosted Strands agent with mem0 persistent memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "strands-agents[ollama]==1.44.0",
    "mem0ai[nlp]==2.0.4",
    # spaCy English model used by mem0 for lemmatization (BM25) and entity
    # extraction. Pinned to track the spaCy version pulled in transitively
    # via mem0ai[nlp]; bump together if either changes.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.50",
    "psycopg2-binary==2.9.12",
    "requests==2.34.2",
    "feedparser==6.0.12",
    "croniter==6.2.2",
]

[project.optional-dependencies]
search = [
    "exa-py==2.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required because en_core_web_sm is declared via a direct URL in dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pythia_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require the docker compose stack (deselected by default)",
]
addopts = "--cov=pythia_agent --cov-report=term-missing --cov-report=html -m 'not integration'"

[tool.coverage.run]
source = ["src/pythia_agent"]

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.ruff]
line-length = 120
target-version = "py314"
